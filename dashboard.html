<!doctype html>
<html lang="vi"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif;color:#1b1917;background:#FAF7F4}
button,select,input{font-family:inherit;font-size:14px}button{cursor:pointer}
.wrap{display:flex;flex-wrap:wrap;min-height:100vh}aside{flex:1 1 240px;background:#1b1917;color:#E9E2DB;padding:24px 16px;display:flex;flex-direction:column;gap:20px}
main{flex:999 1 560px;min-width:0;padding:28px 32px;display:flex;flex-direction:column;gap:20px}
.logo{display:inline-block;background:#ff5834;color:#1b1917;font-size:11px;font-weight:800;letter-spacing:.12em;padding:6px 11px;border-radius:99px}
.nav{display:block;width:100%;padding:11px 14px;margin-bottom:4px;border:0;border-radius:12px;font-size:15px;text-align:left;font-weight:500;background:transparent;color:#E9E2DB}
.nav.on{background:#ff5834;color:#1b1917;font-weight:700}
.card{background:#fff;border:1px solid #E8E1DA;border-radius:18px;padding:20px}.h{margin:0 0 14px;font-size:16px;font-weight:700}
.m{color:#6B625B;font-size:13px}.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.tg{background:#EEE9E4;color:#4A423C}.to{background:#FFE3D5;color:#9A2E0C}.tr{background:#FDE3E1;color:#9B1C1C}.tgr{background:#DDF3E4;color:#1D6B3B}.ta{background:#FFF0C2;color:#7A5200}.tb{background:#E1ECFA;color:#1F4E8C}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.kpi b{display:block;font-size:38px;font-weight:800;line-height:1.2;margin:6px 0 2px}
.flex{display:flex;flex-wrap:wrap;gap:16px}.bar{height:14px;border-radius:99px;background:#F1EAE3}.bar i{display:block;height:100%;min-width:6px;border-radius:99px;background:#ff5834}
.fr{display:grid;grid-template-columns:minmax(120px,190px) 1fr 96px;gap:12px;align-items:center;font-size:14px;margin-bottom:12px}
.trow{display:grid;grid-template-columns:150px minmax(140px,1fr) minmax(200px,2.2fr) 80px;gap:12px;align-items:center;padding:13px 4px;border-top:1px solid #EEE7E0;font-size:14px}
.row{display:grid;grid-template-columns:minmax(150px,1.6fr) minmax(150px,1.4fr) .7fr .8fr .9fr .8fr 1fr;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid #EEE7E0;font-size:14px}
.rowh{border-top:0;font-size:12px;font-weight:700;color:#6B625B;text-transform:uppercase;letter-spacing:.04em}
.chip{padding:8px 14px;border-radius:99px;border:1px solid #D9D0C7;background:#fff;color:#1b1917;font-weight:500}.chip.on{background:#1b1917;color:#fff;border-color:#1b1917}
.col{flex:1 1 200px;min-width:0;background:#F1EAE3;border-radius:16px;padding:14px;align-self:flex-start}.cd{background:#fff;border:1px solid #E8E1DA;border-radius:12px;padding:12px;margin-top:8px;font-size:14px}
.cd select{width:100%;margin-top:8px;padding:6px;border-radius:8px;border:1px solid #D9D0C7;background:#fff}input[type=search]{padding:8px 14px;border-radius:99px;border:1px solid #D9D0C7;min-width:220px}
</style></head><body>
<div class="wrap"><aside><div><span class="logo">TRIGGER TO OFFER</span><div style="font-size:22px;font-weight:800;margin-top:12px;color:#fff">Dashboard</div></div><nav id="nav"></nav>
<div class="m" style="color:#A39A92;margin-top:auto;line-height:1.5">Contacts, Pheu, Viec can lam cập nhật mỗi giờ. Đổi trạng thái đơn và thu hồi ebook ghi thẳng vào Sheet.</div></aside>
<main><header style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px"><div><h1 id="t" style="margin:0;font-size:28px;font-weight:800"></h1><div class="m" id="u">Đang tải…</div></div><button class="chip" id="rf">Tải lại</button></header>
<div id="v"></div></main></div>
<script>
var D=null,view='tq',flt='all',q='',NAMES={tq:'Tổng quan',viec:'Việc cần làm',ng:'Người quan tâm',wb:'Webinar',tl:'Tài liệu',kh:'Khoá học',nguon:'Nguồn'};
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ago(ms){if(!ms)return '–';var h=(D.now-ms)/36e5;if(h<1)return 'Vừa xong';if(h<24)return Math.floor(h)+' giờ trước';var d=Math.floor(h/24);return d<30?d+' ngày trước':'Hơn 1 tháng'}
var LV={'Nóng':'tr','Ấm':'ta','Lạnh':'tb'},ST={'Học viên':'tgr','Giữ chỗ':'to','Hẹn tư vấn':'to','Đã tư vấn':'to','Nộp đơn':'ta','Từ chối':'tg','Chờ đợt sau':'tg'};
function pill(t,x){return x?'<span class="pill '+t+'">'+esc(x)+'</span>':'–'}
function isLate(a){return a.status==='Mới'&&a.time&&(D.now-a.time)/36e5>48}
function nav(){$('nav').innerHTML=Object.keys(NAMES).map(function(k){return '<button class="nav'+(k===view?' on':'')+'" data-v="'+k+'">'+NAMES[k]+'</button>'}).join('')}
function load(){$('u').textContent='Đang tải…';google.script.run.withSuccessHandler(function(d){D=d;$('u').textContent='Cập nhật '+new Date(d.now).toLocaleString('vi-VN');draw()}).withFailureHandler(function(e){$('v').innerHTML='<div class="card">Không tải được dữ liệu: '+esc(e.message)+'</div>'}).dashData()}
function draw(){nav();$('t').textContent=NAMES[view];$('v').innerHTML=errBox()+{tq:vTq,viec:vViec,ng:vNg,wb:vWb,tl:vTl,kh:vKh,nguon:vNguon}[view]();if(view==='ng')tb()}
function vTq(){
 var f=D.funnel,max=Math.max.apply(null,f.map(function(x){return +x.n||0}).concat(1)),A=D.apps;
 var paid=A.filter(function(a){return a.status==='Đã đóng phí'}).length,hold=A.filter(function(a){return a.status==='Giữ chỗ'}).length,lt=A.filter(isLate).length;
 var k=[['Đăng ký webinar',f[0]?f[0].n:'–',f[1]?f[1].n+' người đã làm khảo sát':''],['Nộp đơn khoá',A.length,'tổng số đơn'],['Đơn quá 48 giờ',lt,'cần liên hệ ngay'],['Chỗ còn lại',Math.max(D.cap-paid-hold,0)+' / '+D.cap,paid+' đã đóng phí, '+hold+' giữ chỗ']];
 var o='<div class="kpis">'+k.map(function(x,i){return '<div class="card kpi"><div class="m">'+x[0]+'</div><b'+(i===2&&lt?' style="color:#B3261E"':'')+'>'+esc(x[1])+'</b><div class="m">'+esc(x[2])+'</div></div>'}).join('')+'</div>';
 o+='<div class="flex"><section class="card" style="flex:3 1 420px;min-width:0"><h2 class="h">Phễu: từ đăng ký webinar đến đóng phí</h2>';
 o+=f.length?f.map(function(x,i){return '<div class="fr"><span>'+esc(x.label)+'</span><div class="bar"><i style="width:'+((+x.n||0)/max*100)+'%"></i></div><span style="text-align:right"><b>'+esc(x.n)+'</b> <span class="m">'+(x.pct===''||x.pct==null?'':Math.round(x.pct*100)+'%')+'</span></span></div>'}).join('')+'<div class="m">Phần trăm là so với bước trước. "Nộp đơn" gồm cả người không qua webinar.</div>':'<div class="m">Chưa có dữ liệu phễu. Hãy chạy capNhatContacts() ở project webinar.</div>';
 o+='</section><section class="card" style="flex:2 1 300px;min-width:0"><h2 class="h">Cần làm hôm nay</h2>'+(D.tasks.length?D.tasks.slice(0,4).map(function(t){return '<div style="padding:10px 0;border-top:1px solid #EEE7E0;font-size:14px"><b>'+esc(t.name)+'</b><div class="m">'+esc(t.detail)+'</div></div>'}).join(''):'<div class="m">Không có việc nào đang chờ.</div>')+'</section></div>';
 var S={};D.people.forEach(function(p){var s=p.source||'Không rõ';S[s]=S[s]||{r:0,p:0};if(p.web!=null)S[s].r++;if(p.stage==='Học viên')S[s].p++});
 var ks=Object.keys(S).sort(function(a,b){return S[b].r-S[a].r}),mx=Math.max.apply(null,ks.map(function(s){return S[s].r}).concat(1));
 return o+'<section class="card"><h2 class="h">Nguồn nào ra học viên thật</h2>'+(ks.length?ks.map(function(s){return '<div class="fr" style="grid-template-columns:minmax(100px,160px) 1fr minmax(150px,200px)"><span>'+esc(s)+'</span><div class="bar"><i style="width:'+(S[s].r/mx*100)+'%;background:#1b1917"></i></div><span><b>'+S[s].r+'</b> đăng ký · <b>'+S[s].p+'</b> đóng phí</span></div>'}).join(''):'<div class="m">Chưa có dữ liệu.</div>')+'</section>';
}
function vViec(){
 return '<section class="card"><h2 class="h">Đơn mới cần liên hệ và việc đến hạn</h2>'+(D.tasks.length?D.tasks.map(function(t){var l=String(t.detail).indexOf('quá 48h')>=0;return '<div class="trow"><span>'+pill(t.kind==='Việc đến hạn'?'tb':(l?'tr':'ta'),t.kind)+'</span><span><b>'+esc(t.name)+'</b><div class="m">'+esc(t.phone)+'</div></span><span>'+esc(t.detail)+'</span><span>'+pill(LV[t.level],t.level)+'</span></div>'}).join(''):'<div class="m">Không có việc nào đang chờ.</div>')+'</section>';
}
function vNg(){
 return '<div class="flex" style="gap:8px;align-items:center">'+[['all','Tất cả ('+D.people.length+')'],['hot','Mức độ Nóng'],['late','Quá 48h']].map(function(c){return '<button class="chip'+(c[0]===flt?' on':'')+'" data-f="'+c[0]+'">'+c[1]+'</button>'}).join('')+'<input type="search" id="q" placeholder="Tìm tên, email, SĐT" value="'+esc(q)+'"></div><section class="card" style="padding:0;overflow-x:auto"><div style="min-width:820px"><div class="row rowh"><span>Họ tên</span><span>Giai đoạn</span><span>Webinar</span><span>Ebook</span><span>Đơn khoá</span><span>Mức độ</span><span>Gần nhất</span></div><div id="tb"></div></div></section>';
}
function tb(){
 var s=q.toLowerCase(),L=D.people.filter(function(p){return (flt==='all'||(flt==='hot'&&p.level==='Nóng')||(flt==='late'&&String(p.alert).indexOf('QUÁ')===0))&&(!s||(p.name+' '+p.email+' '+p.phone).toLowerCase().indexOf(s)>=0)});
 $('tb').innerHTML=L.length?L.map(function(p){return '<div class="row"><span><b>'+esc(p.name||p.email)+'</b><div class="m">'+esc(p.phone)+'</div></span><span>'+pill(ST[p.stage]||'tg',p.stage)+(String(p.alert).indexOf('QUÁ')===0?' <span class="pill tr">Quá 48h</span>':'')+'</span><span>'+(p.web!=null?'✓':'–')+'</span><span>'+(p.ebook?(p.opens||'0')+' lần':'–')+'</span><span>'+esc(p.track||'–')+'</span><span>'+pill(LV[p.level],p.level)+'</span><span class="m">'+ago(p.last)+'</span></div>'}).join(''):'<div class="m" style="padding:16px">Không có ai khớp.</div>';
}
function vKh(){
 var A=D.apps,paid=A.filter(function(a){return a.status==='Đã đóng phí'}).length,hold=A.filter(function(a){return a.status==='Giữ chỗ'}).length,left=Math.max(D.cap-paid-hold,0);
 var o='<section class="card" style="display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center"><b>Đợt này: '+D.cap+' chỗ</b><span>'+paid+' đã đóng phí</span><span>'+hold+' giữ chỗ</span>'+pill('to','Còn '+left+' chỗ')+'</section><div class="flex" style="align-items:flex-start">';
 return o+D.statuses.map(function(st){var L=A.filter(function(a){return a.status===st}).sort(function(a,b){return (a.time||0)-(b.time||0)});
  return '<section class="col"><div style="display:flex;justify-content:space-between;font-weight:700;font-size:14px"><span>'+st+'</span>'+pill('tg',L.length)+'</div>'+L.map(function(a){return '<div class="cd"><b>'+esc(a.name)+'</b><div class="m">'+esc(a.track)+' · '+ago(a.time)+(isLate(a)?' · quá 48h':'')+'</div><select class="sts" data-r="'+a.row+'" data-e="'+esc(a.email)+'">'+D.statuses.map(function(x){return '<option'+(x===st?' selected':'')+'>'+x+'</option>'}).join('')+'</select></div>'}).join('')+'</section>'}).join('')+'</div>';
}

function errBox(){return D.errors&&D.errors.length?'<div class="card" style="background:#FFF0C2;border-color:#E8D48A;font-size:14px"><b>Một số tab đọc lỗi:</b><br>'+D.errors.map(esc).join('<br>')+'</div>':''}
function dist(rows,key,multi){var m={};rows.forEach(function(r){var v=r[key];if(v==null||v==='')return;(multi?String(v).split('; '):[String(v)]).forEach(function(x){if(x)m[x]=(m[x]||0)+1})});return m}
function bars(m,total,title,order){var ks=order||Object.keys(m).sort(function(a,b){return m[b]-m[a]}),mx=Math.max.apply(null,ks.map(function(k){return m[k]}).concat(1));return '<section class="card" style="flex:1 1 320px;min-width:0"><h2 class="h">'+title+'</h2>'+(ks.length?ks.map(function(k){return '<div class="fr" style="grid-template-columns:minmax(100px,170px) 1fr 84px"><span>'+esc(k)+'</span><div class="bar"><i style="width:'+m[k]/mx*100+'%"></i></div><span><b>'+m[k]+'</b> <span class="m">'+Math.round(m[k]/total*100)+'%</span></span></div>'}).join(''):'<div class="m">Chưa có dữ liệu.</div>')+'</section>'}
function kp(k){return '<div class="kpis">'+k.map(function(x){return '<div class="card kpi"><div class="m">'+x[0]+'</div><b>'+esc(x[1])+'</b><div class="m">'+esc(x[2])+'</div></div>'}).join('')+'</div>'}
function tr(cols,c,h){return '<div class="row'+(h?' rowh':'')+'" style="grid-template-columns:'+cols+'">'+c.map(function(x){return '<span>'+x+'</span>'}).join('')+'</div>'}
function fdt(ms){return ms?new Date(ms).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'–'}
function vWb(){var W=D.web,n=W.length;if(!n)return '<div class="card">Chưa có dữ liệu webinar.</div>';
 var sv=W.filter(function(x){return x.info||x.action}).length,cf=W.map(function(x){return +x.conf}).filter(Boolean),lk=W.filter(function(x){return x.link}).length;
 var day={},ks=[];W.slice().sort(function(a,b){return (a.t||0)-(b.t||0)}).forEach(function(x){if(!x.t)return;var d=new Date(x.t).toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'});if(!(d in day)){day[d]=0;ks.push(d)}day[d]++});
 var qs=W.filter(function(x){return x.q}).reverse().slice(0,8);
 return kp([['Đăng ký',n,''],['Làm khảo sát',Math.round(sv/n*100)+'%',sv+' người'],['Tự tin phân biệt',cf.length?(cf.reduce(function(a,b){return a+b},0)/cf.length).toFixed(1)+' / 5':'–','trung bình'],['Để link bài viết',Math.round(lk/n*100)+'%',lk+' người']])
 +'<div class="flex">'+bars(day,n,'Đăng ký theo ngày',ks)+bars(dist(W,'action'),n,'Bài nào khiến hành động')+bars(dist(W,'role'),n,'Họ là ai')+'</div><div class="flex">'+bars(dist(W,'want',1),n,'Mong mang về gì')+bars(dist(W,'src'),n,'Biết webinar qua đâu')+bars(dist(W,'exp',1),n,'Đã từng viết gì')+'</div>'
 +'<section class="card"><h2 class="h">Câu hỏi gửi trước</h2>'+(qs.length?qs.map(function(x){return '<div style="padding:10px 0;border-top:1px solid #EEE7E0;font-size:14px"><b>'+esc(x.name)+'</b><div>'+esc(x.q)+'</div></div>'}).join(''):'<div class="m">Chưa có câu hỏi.</div>')+'</section>'}
function vTl(){var d=D.docs,now=D.now,ex=function(x){return x.exp&&x.exp<now},act=d.filter(function(x){return x.status==='active'&&!ex(x)}).length,exd=d.filter(function(x){return x.status==='active'&&ex(x)}).length,pd=d.filter(function(x){return x.status==='pending'}).length,rv=d.filter(function(x){return x.status==='revoked'}).length,op=d.reduce(function(a,x){return a+x.opens},0),C='minmax(150px,1.4fr) minmax(150px,1.4fr) 1fr .7fr 1fr 110px';
 return kp([['Đã cấp',d.length,'quyền đọc'],['Đang hiệu lực',act,''],['Hết hạn',exd,''],['Chờ thanh toán',pd,'cần duyệt'],['Đã thu hồi',rv,'tổng '+op+' lượt mở']])
 +'<section class="card" style="padding:0;overflow-x:auto"><div style="min-width:820px">'+tr(C,['Họ tên','Email','Trạng thái','Lượt mở','Mở gần nhất',''],1)+(d.length?d.map(function(x){var on=x.status==='active',pe=x.status==='pending';return tr(C,['<b>'+esc(x.name)+'</b>',esc(x.email),pe?pill('ta','Chờ thanh toán'):on?(ex(x)?pill('ta','Hết hạn'):pill('tgr','Đang dùng')):pill('tr','Đã thu hồi'),x.opens,'<span class="m">'+fdt(x.last)+'</span>','<button class="chip" data-rv="'+x.row+'" data-e="'+esc(x.email)+'" data-s="'+(on?'revoked':'active')+'">'+(pe?'Duyệt &amp; gửi mã':on?'Thu hồi':'Khôi phục')+'</button>'])}).join(''):'<div class="m" style="padding:16px">Chưa cấp ebook cho ai.</div>')+'</div></section>'
 +'<section class="card"><h2 class="h">Nhật ký mở ebook gần đây</h2>'+(D.elog.length?D.elog.map(function(x){return '<div style="display:flex;gap:16px;padding:8px 0;border-top:1px solid #EEE7E0;font-size:14px"><span class="m" style="min-width:110px">'+fdt(x.t)+'</span><span style="flex:1">'+esc(x.who)+'</span><span>'+pill(x.res==='mở thành công'?'tgr':'tr',x.res)+'</span></div>'}).join(''):'<div class="m">Chưa có lượt mở nào.</div>')+'</section>'}
function vNguon(){var S={},C={};D.people.forEach(function(p){var s=p.source||'Không rõ',o=S[s]=S[s]||{r:0,a:0,c:0,p:0};if(p.web!=null)o.r++;if(p.status){o.a++;if(['Đã tư vấn','Giữ chỗ','Đã đóng phí'].indexOf(p.status)>=0)o.c++;if(p.status==='Đã đóng phí')o.p++}});
 D.apps.forEach(function(a){var k=a.camp||'(không có chiến dịch)',o=C[k]=C[k]||{n:0,p:0};o.n++;if(a.status==='Đã đóng phí')o.p++});
 var ks=Object.keys(S).sort(function(a,b){return S[b].r-S[a].r}),cs=Object.keys(C).sort(function(a,b){return C[b].n-C[a].n}),H='minmax(130px,1.4fr) repeat(5,1fr)',H2='minmax(180px,2fr) 1fr 1fr';
 return '<section class="card" style="padding:0;overflow-x:auto"><div style="min-width:700px">'+tr(H,['Nguồn','Đăng ký webinar','Nộp đơn','Đã tư vấn+','Đóng phí','Đóng phí / đăng ký'],1)+(ks.length?ks.map(function(s){var o=S[s];return tr(H,['<b>'+esc(s)+'</b>',o.r,o.a,o.c,o.p,o.r?Math.round(o.p/o.r*100)+'%':'–'])}).join(''):'<div class="m" style="padding:16px">Chưa có dữ liệu.</div>')+'</div></section>'
 +'<section class="card" style="padding:0;overflow-x:auto"><div style="min-width:520px"><div style="padding:16px 16px 0" class="h">Theo chiến dịch (utm_campaign của đơn khoá học)</div>'+tr(H2,['Chiến dịch','Số đơn','Đóng phí'],1)+cs.map(function(k){return tr(H2,['<b>'+esc(k)+'</b>',C[k].n,C[k].p])}).join('')+'</div></section>'}
document.addEventListener('click',function(e){var t=e.target;if(t.dataset.v){view=t.dataset.v;draw()}else if(t.dataset.f){flt=t.dataset.f;draw()}else if(t.id==='rf')load();else if(t.dataset.rv){var r=+t.dataset.rv,st=t.dataset.s;t.disabled=true;google.script.run.withSuccessHandler(function(){D.docs.forEach(function(d){if(d.row===r)d.status=st});draw()}).withFailureHandler(function(er){alert(er.message);load()}).dashSetEbookStatus(r,t.dataset.e,st)}});
