<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ebook · Trigger to Offer</title>
<style>
body.lock{margin:0;min-height:100vh;display:grid;place-items:center;background:#1b1917;color:#fff;font:16px/1.6 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#gate{width:min(420px,90vw);padding:34px;border-radius:22px;background:#27231f;border:1px solid #3a342f}
#gate .t{display:inline-block;background:#ff5834;font:700 11px/1 sans-serif;letter-spacing:.12em;padding:7px 12px;border-radius:99px}
#gate h1{font-size:26px;line-height:1.2;margin:18px 0 8px}
#gate p{color:#cfc7c0;margin:0 0 18px;font-size:15px}
#gate input{width:100%;padding:14px;border-radius:12px;border:1px solid #4a423c;background:#1b1917;color:#fff;font-size:16px;box-sizing:border-box}
#gate button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:99px;background:#ff5834;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
#gate button:disabled{opacity:.6;cursor:wait}
#msg{margin-top:12px;color:#ff9a80;font-size:14px;min-height:20px}
</style>
</head>
<body class="lock">
<div id="gate">
  <span class="t">TRIGGER TO OFFER</span>
  <h1>Ebook Copywriting Clinic</h1>
  <p>Nhập mật khẩu đã được gửi qua email của bạn.</p>
  <form id="f">
    <input id="pw" type="password" autocomplete="off" placeholder="Mật khẩu" autofocus>
    <button id="btn">Mở ebook</button>
  </form>
  <div id="msg"></div>
</div>
<script>
// DÁN URL Web App (kết thúc bằng /exec) - chính là URL form webinar đang dùng
const API = "https://script.google.com/macros/s/DAN_URL_WEBAPP/exec";
const $ = id => document.getElementById(id);
const ERR = {
  wrong: "Mật khẩu chưa đúng. Vui lòng kiểm tra lại email.",
  expired: "Bản này đã hết hạn. Vui lòng xin mật khẩu mới.",
  revoked: "Quyền truy cập này đã bị thu hồi. Vui lòng liên hệ để được hỗ trợ.",
  empty: "Bạn chưa nhập mật khẩu."
};

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  $("msg").textContent = "Đang kiểm tra…";
  $("btn").disabled = true;
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // text/plain để tránh preflight CORS
      body: JSON.stringify({ action: "ebook", password: $("pw").value.trim() })
    });
    const o = await res.json();
    if (!o.ok) { $("msg").textContent = ERR[o.error] || "Có lỗi xảy ra, vui lòng thử lại."; $("btn").disabled = false; return; }
    show(o);
  } catch (err) {
    $("msg").textContent = "Không kết nối được. Vui lòng kiểm tra mạng và thử lại.";
    $("btn").disabled = false;
  }
});

function show(o) {
  document.open(); document.write(o.html); document.close();
  const b = document.body;
  const s = String(o.who || "").replace(/[<>&"']/g, "");
  const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='380' height='240'><text x='24' y='130' transform='rotate(-24 190 120)' font-size='15' font-family='sans-serif' fill='#777' fill-opacity='.35'>" + s + "</text></svg>";
  const w = document.createElement("div");
  w.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:99999;background-image:url(\"data:image/svg+xml," + encodeURIComponent(svg) + "\")";
  b.appendChild(w);
  document.addEventListener("contextmenu", x => x.preventDefault());
  document.addEventListener("dragstart", x => x.preventDefault());
  document.addEventListener("keydown", x => { if ((x.ctrlKey || x.metaKey) && "spcua".includes(x.key.toLowerCase())) x.preventDefault(); });
}
</script>
</body>
</html>
